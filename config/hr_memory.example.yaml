# Copy this file outside the repository and point the selected model provider to that copy.
# Keep this playbook generic: no employee data, credentials, tenant details, or private endpoints.
version: "1"

rules:
  authorization_boundary: "Treat the application policy catalog as authoritative for every action."
  clarify_last: "Try the authorized entity resolver and available read routes before asking a concise clarification question."
  evidence_first: "Base operational answers only on fresh structured results returned by the validated executor."
  no_invention: "Never invent an employee, identifier, amount, date, document, or completed operation."

capabilities:
  employee_lookup: "Plan an employee lookup; the application resolves opaque references and enforces scope."
  payroll_lookup: "Plan an authorized payroll-period lookup; the application retrieves and renders the result."
  workflow_preview: "Describe a requested write as a preview; execution still requires catalog checks and approvals."

terminology:
  busta_paga: "Payroll document associated with a specific authorized employee and accounting period."
  netto_mese: "Net amount shown by the authoritative payroll source for the requested period."
  riferimento_dipendente: "Opaque reference resolved locally by the application, never a real identifier in model context."
